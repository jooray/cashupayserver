name: Release

# Cuts an immutable, versioned GitHub release when a v* tag is pushed.
#
# Replaces the old moving-tag "channel" release model. Each release carries
# four assets:
#   - barebits-<tag>.zip                     the standalone app (auto-updater downloads this)
#   - barebits-windows-<tag>.zip             the Windows desktop package (portable POS)
#   - barebits_wordpress_plugin-<tag>.zip    the WordPress plugin (humans / WP install this)
#   - barebits_wordpress_plugin_wporg-<tag>.zip  the wordpress.org submission variant
#                                            (no installer.php — URL-connect only)
#   - BUILD_INFO                             stable-named metadata the updater reads first
#
# The release version comes from the tag; scripts/verify-release-version.sh
# fails the build if the in-tree version strings disagree, so a tag can never
# ship advertising the wrong version.
#
# Channel semantics: a plain vX.Y[.Z] tag is a STABLE release (feeds the
# updater's 'main' channel via GitHub's /releases/latest). A tag with a
# prerelease suffix (v0.4-alpha, v1.0.0-rc1, ...) is published as a GitHub
# prerelease and feeds the 'testing' channel (newest release of any kind).
#
# Structure: build (ubuntu) -> windows-smoke (windows) -> publish (ubuntu).
# The Windows desktop zip is assembled on Linux (it's just file plumbing:
# official windows.php.net runtime + the app + launcher assets), then booted
# for real on a Windows runner before anything is published — a broken
# desktop package must never gate-crash a release.

on:
  push:
    tags:
      - "v*"
  # Reusable entry point. testing-release.yml calls this on every push to the
  # `testing` branch, passing a v<version>-testing.<run#> prerelease tag so a
  # testing-channel release is cut without duplicating the build/publish steps
  # and without needing a PAT to re-trigger a tag-push workflow.
  workflow_call:
    inputs:
      tag:
        description: >-
          Release tag to cut (e.g. v1.2-testing.5). Defaults to the pushed tag
          when this workflow is triggered by a tag push.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    # Effective tag: the workflow_call input (testing-release.yml passes a
    # v<version>-testing.<run#> prerelease tag) or, for a direct tag push, the
    # pushed ref. Every step below uses $TAG / env.TAG, never github.ref_name.
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
      make_latest: ${{ steps.classify.outputs.make_latest }}

    steps:
      - name: Use HTTPS for SSH-form submodule URLs
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: curl, json, gmp, mbstring, sqlite3, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify in-tree version matches the tag
        run: ./scripts/verify-release-version.sh "$TAG"

      - name: Classify release (stable vs prerelease)
        id: classify
        # A plain vMAJOR.MINOR[.PATCH] tag is stable; anything with a suffix
        # (-alpha / -beta / -rc / ...) is a prerelease. Stable releases are
        # marked "latest" so the updater's 'main' channel (/releases/latest)
        # advances; prereleases must NOT be latest, or 'main' would jump to a
        # prerelease.
        run: |
          tag="$TAG"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true"  >> "$GITHUB_OUTPUT"
            echo "channel=main (stable)"    >> "$GITHUB_STEP_SUMMARY"
          else
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "channel=testing (prerelease)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build standalone zip
        env:
          COMMIT_SHA: ${{ github.sha }}
          CHANNEL: ${{ steps.classify.outputs.prerelease == 'true' && 'testing' || 'main' }}
        run: ./scripts/build-standalone.sh

      - name: Verify standalone layout
        run: |
          php scripts/verify-plugin-build.php build/barebits \
            setup.php \
            admin.php \
            api.php \
            router.php \
            index.php \
            health.php \
            pay.php \
            product-image.php \
            update.php \
            provision.php \
            sso.php \
            recover.php \
            includes/database.php \
            LICENSE.md \
            USE_POLICY.md

      - name: Build WordPress plugin
        env:
          # A testing-channel plugin must install a testing-channel server
          # (see the channel stamp in build-wordpress-plugin.sh).
          CASHUPAY_PLUGIN_CHANNEL: ${{ steps.classify.outputs.prerelease == 'true' && 'testing' || 'stable' }}
        run: ./scripts/build-wordpress-plugin.sh

      - name: Verify WordPress plugin layout
        # The plugin is GPL WordPress glue only — verify no BareBits server
        # code (includes/, vendor/, entry points) leaks into the zip.
        run: |
          php scripts/verify-plugin-build.php build/wp/barebits \
            barebits.php \
            uninstall.php \
            state.php \
            installer.php \
            onboarding.php \
            admin-menu.php \
            cron-integration.php \
            btcpay-integration.php \
            payment-discount.php \
            gateway-guard.php \
            readme.txt \
            license.txt \
            assets/img/barebits-gateway-logo.png \
            assets/js/discount-classic.js \
            assets/js/discount-blocks.js
          for leaked in includes vendor setup.php admin.php api.php cron.php payment.php; do
            if [ -e "build/wp/barebits/$leaked" ]; then
              echo "BareBits server code leaked into the GPL plugin build: $leaked" >&2
              exit 1
            fi
          done

      - name: Verify WordPress plugin layout (wordpress.org variant)
        # Same layout, minus installer.php: the wordpress.org directory's
        # guidelines forbid plugins fetching executable code, so the variant
        # must never ship the install-alongside downloader.
        run: |
          php scripts/verify-plugin-build.php build/wporg/barebits \
            barebits.php \
            uninstall.php \
            state.php \
            onboarding.php \
            admin-menu.php \
            cron-integration.php \
            btcpay-integration.php \
            payment-discount.php \
            gateway-guard.php \
            readme.txt \
            license.txt \
            assets/img/barebits-gateway-logo.png \
            assets/js/discount-classic.js \
            assets/js/discount-blocks.js
          for leaked in installer.php includes vendor setup.php admin.php api.php cron.php payment.php; do
            if [ -e "build/wporg/barebits/$leaked" ]; then
              echo "forbidden file in the wordpress.org plugin build: $leaked" >&2
              exit 1
            fi
          done

      - name: Build Windows desktop zip
        run: ./scripts/build-windows-desktop.sh

      - name: Verify Windows desktop layout
        run: |
          php scripts/verify-plugin-build.php build/BareBits \
            BareBits.bat \
            desktop-helper.php \
            cron-runner.php \
            README.txt \
            vc_redist.x64.exe \
            php/php.exe \
            php/ext/php_gmp.dll \
            php/cacert.pem \
            php/php.ini.template \
            php/render-ini.php \
            app/router.php \
            app/cron.php \
            app/includes/database.php

      - name: Version-stamp the release assets
        # Rename the fixed build outputs to version-stamped asset names. The
        # ZIP internals are untouched: barebits.zip extracts to barebits/
        # (the updater hardcodes that), barebits_wordpress_plugin.zip
        # contains barebits/ (the WP plugin slug), and the Windows zip
        # extracts to BareBits/.
        run: |
          tag="$TAG"
          cp build/barebits.zip "build/barebits-${tag}.zip"
          cp build/barebits_wordpress_plugin.zip "build/barebits_wordpress_plugin-${tag}.zip"
          cp build/barebits_wordpress_plugin_wporg.zip "build/barebits_wordpress_plugin_wporg-${tag}.zip"
          cp build/barebits-windows.zip "build/barebits-windows-${tag}.zip"
          # Checksums for everything we publish. The WordPress plugin's
          # "install BareBits alongside" flow verifies its downloaded
          # standalone zip against this file.
          (cd build && sha256sum \
            "barebits-${tag}.zip" \
            "barebits_wordpress_plugin-${tag}.zip" \
            "barebits_wordpress_plugin_wporg-${tag}.zip" \
            "barebits-windows-${tag}.zip" > SHA256SUMS)

      - name: Upload release assets for later jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 3
          path: |
            build/barebits-${{ env.TAG }}.zip
            build/barebits_wordpress_plugin-${{ env.TAG }}.zip
            build/barebits_wordpress_plugin_wporg-${{ env.TAG }}.zip
            build/barebits-windows-${{ env.TAG }}.zip
            build/SHA256SUMS
            build/barebits/BUILD_INFO

  # Boot the Windows desktop package on real Windows before publishing. The
  # scenarios live in scripts/windows-smoke.ps1 (shared with the PR-time
  # windows-desktop-smoke.yml workflow): runtime checks (extensions, gmp,
  # cron-runner), launcher boot + browser hook, a functional pass that walks
  # the onboarding wizard and API end to end (scripts/desktop-smoke.php),
  # a configured cron pass, double-launch, custom port, a hostile install
  # path (spaces + non-ASCII), and helper self-shutdown.
  windows-smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout (smoke scripts)
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: build

      - name: Run Windows desktop smoke
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Zip "build/barebits-windows-$env:TAG.zip"

  publish:
    needs: [build, windows-smoke]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # When the tag doesn't exist yet (the workflow_call path), GitHub
          # creates it while publishing — and without an explicit target it
          # points the tag at the default branch's head, not the commit that
          # was built. Pin it to the built commit. Ignored when the tag
          # already exists (the tag-push path).
          target_commitish: ${{ github.sha }}
          name: "BareBits ${{ env.TAG }}"
          # Prerelease (testing-channel) bodies lead with an instability
          # warning pointing at the stable channel; on stable releases the
          # expression yields an empty line, which GitHub's renderer trims.
          body: |
            ${{ needs.build.outputs.prerelease == 'true' && 'Warning: This is a testing release and may be unstable or insecure, use the [latest main](https://github.com/BareBits/cashupayserver/releases/latest) release instead' || '' }}

            BareBits ${{ env.TAG }}, built from ${{ github.sha }}.

            Assets:
            - `barebits-${{ env.TAG }}.zip` — standalone server (the auto-updater pulls this)
            - `barebits-windows-${{ env.TAG }}.zip` — Windows desktop package (portable point-of-sale; see README.txt inside)
            - `barebits_wordpress_plugin-${{ env.TAG }}.zip` — WordPress plugin
            - `barebits_wordpress_plugin_wporg-${{ env.TAG }}.zip` — WordPress plugin, wordpress.org submission variant (connect-by-URL only)
            - `SHA256SUMS` — checksums of the zips above
            - `BUILD_INFO` — build metadata
          prerelease: ${{ needs.build.outputs.prerelease }}
          make_latest: ${{ needs.build.outputs.make_latest }}
          files: |
            build/barebits-${{ env.TAG }}.zip
            build/barebits_wordpress_plugin-${{ env.TAG }}.zip
            build/barebits_wordpress_plugin_wporg-${{ env.TAG }}.zip
            build/barebits-windows-${{ env.TAG }}.zip
            build/SHA256SUMS
            build/barebits/BUILD_INFO
