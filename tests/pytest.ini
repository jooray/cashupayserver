[pytest]
testpaths = e2e ui wordpress upgrade
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: tests that take significant time (LN channel ops, multi-mint failover)
    ui: Playwright browser-driven tests
    wordpress: tests that boot a WordPress instance
    upgrade: the published-release upgrade matrix (tests/upgrade/; local suite only, --skip-upgrade-tier in CI)
    phps_only: escape hatch for scenarios that only exist under the php -S backend (none expected; adding one needs explicit sign-off)
# --durations: every run ends with a ranked list of the slowest tests +
# fixture setups (>=1s), so speedup work is aimed with data, not guesses.
addopts = -ra --strict-markers --tb=short --durations=25 --durations-min=1.0
log_cli = false
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s %(message)s
log_date_format = %H:%M:%S
